<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FITMATE Gym Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="app-header">
        <div class="logo-container">
            <span class="logo-accent">FIT</span>MATE
        </div>
        <h1>Gym Member Management</h1>
    </header>

    <div class="dashboard-container">
        
        <aside class="panel-card form-panel">
            <h2>Member Profile Editor</h2>
            <div class="form-grid">
                <input type="text" id="ApplicationID" placeholder="Application ID">
                <input type="text" id="TrainorID" placeholder="Trainer ID">
                <input type="text" id="FirstName" placeholder="First Name" required>
                <input type="text" id="LastName" placeholder="Last Name" required>
                <input type="number" id="Age" placeholder="Age" min="1" required>
                <input type="text" id="PlanID" placeholder="Plan ID" required>
                <input type="tel" id="Phone" placeholder="Phone Number" required>
                <select id="Status" required>
                    <option value="" disabled selected hidden>Select Membership Status</option>
                    <option value="Active">Active</option>
                    <option value="Pending">Pending</option>
                    <option value="Expired">Expired</option>
                </select>
            </div>
            <div class="form-actions">
                <button class="btn btn-success" onclick="addMember()">Add Member</button>
                <button class="btn btn-primary" onclick="updateMember()">Update Member</button>
            </div>
        </aside>

        <main class="panel-card table-panel">
            <div class="table-header">
                <h2>Active Rosters</h2>
                <input type="text" id="search" placeholder="🔍 Search members by name..." onkeyup="searchMember()">
            </div>
            
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Age</th>
                            <th>Phone</th>
                            <th style="text-align: center;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableData">
                        </tbody>
                </table>
            </div>
        </main>
        
    </div>

    <script src="js/script.js"></script>
</body>
</html>
